title = "Xyce_Regression DTEMP"
case = "xyce_dtemp"
source = "pnp_ref.cir"
outputs = [
    "v(1)",
    "v(6)",
    "i(vmon1)",
    "i(vmon2)",
    "i(vmon3)",
]

[options]
temp = 15.0

[[analysis]]
type = "dc"
sweep = [
    { source = "vpos", start = 0.0, stop = 5.0, step = 1.0 },
    { source = "vbb", start = 0.0, stop = -2.0, step = -0.5 },
]
