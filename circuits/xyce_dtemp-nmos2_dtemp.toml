title = "Xyce_Regression DTEMP"
case = "xyce_dtemp"
source = "nmos2_dtemp.cir"
outputs = [
    "v(3)",
    "v(5)",
    "v(3,2)",
    "v(1,2)",
]

[options]
temp = 15.0

[[analysis]]
type = "dc"
sweep = [
    { source = "vgg", start = 0.0, stop = 18.0, step = 1.0 },
    { source = "vdd", start = 0.0, stop = 18.0, step = 1.0 },
]
