title = "Xyce_Regression VERILOG_MODEL_BINNING"
case = "xyce_verilog_model_binning"
source = "gummel_nmos_bsim6.cir"
outputs = [
    "v(drain)",
    "v(gate)",
]

[options]
abstol = 1e-06
reltol = 1e-06
temp = 25.0

[[analysis]]
type = "dc"
sweep = [
    { source = "vdrain", start = -0.1, stop = 0.1, step = 0.001 },
    { source = "vgate", start = 0.0, stop = 1.0, step = 0.2 },
]
