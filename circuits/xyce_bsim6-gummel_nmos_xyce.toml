title = "Xyce_Regression BSIM6"
case = "xyce_bsim6"
source = "gummel_nmos_xyce.cir"
outputs = [
    "v(drain)",
    "v(gate)",
]

[options]
abstol = 1e-06
reltol = 1e-06
temp = 25.0

[[analysis]]
type = "dc"
sweep = [
    { source = "vdrain", start = -0.1, stop = 0.1, step = 0.001 },
    { source = "vgate", start = 0.0, stop = 1.0, step = 0.2 },
]
