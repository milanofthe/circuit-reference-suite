title = "ngspice examples/mos"
case = "ngspice_examples_mos"
source = "nmos_pmos_plotting.sp"
outputs = [
    "v(2)",
    "v(22)",
]

[options]
temp = 27.0

[[analysis]]
type = "dc"
sweep = [
    { source = "vgsn", start = 0.0, stop = 1.5, step = 0.02 },
    { source = "vbsn", start = 0.0, stop = -2.5, step = -0.5 },
]

[[analysis]]
type = "dc"
sweep = [
    { source = "vdsn", start = 0.0, stop = 2.0, step = 0.05 },
    { source = "vgsn", start = 0.0, stop = 2.0, step = 0.4 },
]

[[analysis]]
type = "dc"
sweep = [
    { source = "vgsp", start = 0.0, stop = -1.5, step = -0.02 },
    { source = "vbsp", start = 0.0, stop = 2.5, step = 0.5 },
]

[[analysis]]
type = "dc"
sweep = [
    { source = "vdsp", start = 0.0, stop = -2.0, step = -0.05 },
    { source = "vgsp", start = 0.0, stop = -2.0, step = -0.4 },
]
