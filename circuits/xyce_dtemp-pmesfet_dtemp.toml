title = "Xyce_Regression DTEMP"
case = "xyce_dtemp"
source = "pmesfet_dtemp.cir"
outputs = [
    "v(1)",
    "v(2)",
    "i(vidmon)",
]

[options]
temp = 25.0

[[analysis]]
type = "dc"
sweep = [
    { source = "vgs", start = 0.0, stop = 1.5, step = 0.5 },
    { source = "vds", start = -15.0, stop = 0.0, step = 1.0 },
]
