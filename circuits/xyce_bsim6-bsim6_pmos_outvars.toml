title = "Xyce_Regression BSIM6"
case = "xyce_bsim6"
source = "bsim6_pmos_outvars.cir"
outputs = [
    "v(drain)",
    "v(gate)",
]

[options]
vntol = 1e-06
reltol = 1e-06
temp = 25.0

[[analysis]]
type = "dc"
sweep = [
    { source = "vdrain", start = -0.1, stop = 0.1, step = 0.001 },
    { source = "vgate", start = -1.0, stop = -0.4, step = 0.3 },
]
