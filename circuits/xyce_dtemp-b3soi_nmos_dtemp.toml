title = "Xyce_Regression DTEMP"
case = "xyce_dtemp"
source = "b3soi_nmos_dtemp.cir"
outputs = [
    "v(drain)",
    "v(gate)",
    "i(m1)",
]

[options]
temp = 15.0

[[analysis]]
type = "dc"
sweep = [
    { source = "vd", start = 0.0, stop = 1.2, step = 0.01 },
    { source = "vg", start = 0.2, stop = 1.2, step = 0.1 },
]
