title = "Xyce_Regression BSIM6"
case = "xyce_bsim6"
source = "idvd_pmos_xyce.cir"
outputs = [
    "v(d)",
    "v(g)",
    "i(vd)",
]

[options]
temp = 27.0

[[analysis]]
type = "dc"
sweep = [
    { source = "vd", start = -1.3, stop = 0.0, step = 0.01 },
    { source = "vg", start = -1.0, stop = -0.4, step = 0.3 },
]
