[project]
name = "circref"
version = "0.1.0"
description = "Tooling for the circuit reference suite: validate the corpus, generate its READMEs"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "jsonschema>=4.17",
    "tomli-w>=1.0",
]

[project.scripts]
circref = "circref.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["circref"]
