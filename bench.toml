# The precision levels every analysis runs at, and the bounds the comparison judges by
# (circref/bench.py, circref/compare.py).
#
# A level states circuit options in their SPICE meaning (reltol relative, vntol a voltage,
# abstol a current) in place of the circuit's own; an adapter writes them in its dialect.
# ``points`` bounds a transient's step to (stop - start) / points.

# The circuit as stated: what a user of the simulator gets.
[level.default]

# reltol two decades below the SPICE defaults (reltol 1e-3, vntol 1e-6, abstol 1e-12).
[level.fine]
reltol = 1e-5

# reltol three decades below, the absolute bounds one decade below, on a dense time grid:
# linear interpolation between 20000 points of a period resolved on 1000 of them is off
# by (2 pi / 1000)^2 / 8 = 5e-6 of its peak. Tighter, ngspice 47 and Xyce 7.10 stop with
# "timestep too small" on diode bridges and gate-level CMOS (abstol 1e-16, vntol 1e-10,
# reltol 1e-7: vacask_graetz, vacask_mul, the ISCAS circuits of ngspice_examples_klu).
[level.reference]
reltol = 1e-6
vntol = 1e-7
abstol = 1e-13
points = 20000

[run]
# What is kept of a simulator's output per analysis: its first and last half of this.
log_bytes = 1_000_000
# What a simulator may write into one file. A transient printed on a grid of 5e7 points
# (xyce_hb-gilbert_cell_hbtran on WRspice) is a rawfile of several GB, more than the
# memory of the process that reads it.
output_bytes = 1_000_000_000
# Seconds: a run shorter than this is repeated (circref run --repeats) and timed by its
# minimum, so that load from other processes and cold caches do not count; a longer one
# runs once.
repeat_below = 60

[compare]
# Added to a signal's peak before dividing by it, so a signal near zero does not dominate.
floor = { v = 1e-6, i = 1e-12 }
# The reference of one simulator: its fine and reference runs within this of each other.
converged = 1e-4
# The reference of several: their converged reference runs within this of their median.
agree = 1e-4
bands = [1e-6, 1e-4, 1e-2]

# Plot style (circref/plot.py): transparent, one gray ink that reads on the light and
# the dark GitHub page (#8b949e: 3.1:1 on #ffffff, 6.2:1 on #0d1117), series steps
# that hold 3:1 on both; the grays of states that are not a result, 2:1 on both. Series by simulator in the order of circref.adapters.ADAPTERS.
[plot]
series = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c", "#9085e9", "#e66767"]
ink = "#8b949e"
grid = "#8b949e40"
# The error axis: errors beyond it are plotted at its ends.
error_axis = [1e-16, 1e2]

[plot.status]
ok = "#0ca30c"
failed = "#d03b3b"
error = "#7a1f1f"
timeout = "#ec835a"
killed = "#fab219"
stage-failed = "#6e7681"
untranslated = "#8b949e"
unsupported = "#adb5bd"

[plot.reference_status]
agreed = "#2a78d6"
single = "#86b6ef"
disagree = "#d03b3b"
none = "#8b949e"
"no shared signal" = "#adb5bd"
