id = "circref_sg13g2_comparator"
title = "StrongARM latch comparator with output inverters, IHP SG13G2"
family = "comparator"
category = "switching"
notes = """
Clocked at 1 GHz. The differential input is a triangle of +-100 mV with a period of 40 clock cycles: q follows the clock while v(inp) > v(inn), qb while it is below.
80 clock cycles of 1 ns.
Written for this suite on the IHP SG13G2 open PDK (PSP103 through OSDI, typical corner), in ngspice's and in VACASK's syntax.
"""
netlists = [
    { file = "comparator.cir", dialect = "ngspice" },
    { file = "comparator.cir.vacask", dialect = "vacask" },
]

[source]
name = "circuit-reference-suite"
url = "https://github.com/milanofthe/circuit-reference-suite"
version = "written for the suite"
license = "MIT"
authors = [
    "Milan Rother",
]

