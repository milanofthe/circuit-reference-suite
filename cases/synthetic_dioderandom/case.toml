title = "Random RC graph with a diode per node"
family = "passive"
notes = "The network of synthetic_rcrandom (a path and two random edges per node) with a junction diode from every node to ground: the operating point takes Newton iterations and the matrix values change at every one of them, the elimination structure is that of the linear network. Generated (circref/generate.py); size: nodes."
