id = "synthetic_rcrandom"
title = "RC random network"
family = "passive"
notes = "Linear RC network, a path and two random edges per node, xorshift64 seed 1: little locality, heavy fill. Generated (circref/generate.py), so that the networks differ only in the graph and with it the elimination structure of the matrix; size: nodes."
