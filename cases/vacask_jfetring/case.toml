id = "vacask_jfetring"
title = "JFET ring oscillator"
family = "oscillator"
notes = """
From the Verilog-A Distiller benchmarks of VACASK (`benchmark/vadistiller`): the same
circuit with ngspice's built-in models, with the same models distilled to Verilog-A in
ngspice (OSDI) and in VACASK.
In VACASK, `resistor.osdi` and `capacitor.osdi` are its own basic devices; in
ngspice (OSDI) the distilled ones.
"""

