id = "vacask_ring_psp103"
title = "9-stage CMOS ring oscillator, PSP103"
family = "oscillator"
cost = "time_points"
netlists = [
    { file = "vacask/runme.sim", dialect = "vacask" },
    { file = "ngspice/runme.sim", dialect = "ngspice" },
    { file = "xyce/runme.sim", dialect = "xyce" },
]
notes = """
From the VACASK benchmark suite (`benchmark/README.md` there describes the setup).
The VACASK netlist uses ngspice's models distilled to Verilog-A; ngspice, Xyce and
Gnucap use their built-in models.
PSP103 is built into Xyce (level 103); ngspice and VACASK load it as OSDI.
"""

