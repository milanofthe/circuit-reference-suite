- `tb_moshv_mc_mm_tt_rf.sp`: uses subcircuit sg13_hv_nmos, defined nowhere
- `tb_moshv_mc_stat.sp`: uses subcircuit sg13_hv_nmos, defined nowhere
- `tb_moshv_mc_stat_rf.sp`: uses subcircuit sg13_hv_nmos, defined nowhere
"""

