notes: |
  IHP's ngspice model tests (`libs.tech/gnucap/tests/ngspice`). Upstream runs them with a
  `.spiceinit` that puts `libs.tech/ngspice/models` on ngspice's `sourcepath` and loads the
  PSP103, R3_CMC, MOSVAR and MOM capacitor models as OSDI; `resolve` does the same here.
  Monte Carlo decks use fixed seeds.

  Left out:
  - `tb_cap_cutoff_bcs.sp`: uses subcircuit cap_cmim, defined nowhere
  - `tb_cap_cutoff_mc_mm_bcs.sp`: uses subcircuit cap_cmim, defined nowhere
  - `tb_cap_cutoff_mc_mm_typ.sp`: uses subcircuit cap_cmim, defined nowhere
  - `tb_cap_cutoff_mc_mm_wcs.sp`: uses subcircuit cap_cmim, defined nowhere
  - `tb_cap_cutoff_mc_stat.sp`: uses subcircuit cap_cmim, defined nowhere
  - `tb_cap_cutoff_typ.sp`: uses subcircuit cap_cmim, defined nowhere
  - `tb_cap_cutoff_wcs.sp`: uses subcircuit cap_cmim, defined nowhere
  - `tb_cap_parasitic_bcs.sp`: uses subcircuit cparasitic, defined nowhere
  - `tb_cap_parasitic_typ.sp`: uses subcircuit cparasitic, defined nowhere
  - `tb_cap_parasitic_wcs.sp`: uses subcircuit cparasitic, defined nowhere
